# Offline-ready build configuration for the EvalScope offline bundle.
# Produces a wheel (pure-Python) that can be installed on an offline machine
# with `pip install evalscope-1.11.1-py3-none-any.whl` (deps come from the
# LAN mirror via requirements.txt, install with --no-deps).
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalscope"
version = "1.11.1"
description = "EvalScope Offline: lightweight LLM evaluation framework (offline-ready bundle)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "ModelScope team", email = "contact@modelscope.cn" }]
keywords = ["python", "llm", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "aiohttp",
    "colorlog",
    "docstring_parser",
    "dotenv",
    "editdistance",
    "filetype",
    "jieba",
    "jinja2",
    "jsonlines",
    "jsonschema",
    "latex2sympy2_extended[antlr4_9_3]",
    "litellm<2.0,>=1.55",
    "Markdown",
    "modelscope[datasets]>=1.34",
    "more_itertools",
    "nltk",
    "openai",
    "overrides",
    "pandas",
    "pillow",
    "plotly",
    "pydantic",
    "pylatexenc",
    "pyyaml>=5.1",
    "requests",
    "rich",
    "rouge-chinese",
    "rouge-score>=0.1.0",
    "sacrebleu",
    "sympy",
    "tabulate",
    "tqdm",
    "transformers!=4.57.2,>=4.33",
    "word2number",
    "zhconv",
]

[project.scripts]
evalscope = "evalscope.cli.cli:run_cmd"

[tool.setuptools.packages.find]
include = ["evalscope", "evalscope.*"]

[tool.setuptools.package-data]
evalscope = ["**/*"]